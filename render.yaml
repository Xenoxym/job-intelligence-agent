services:
  - type: web
    name: job-intelligence
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-intelligence-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: API_TOKEN
        generateValue: true
      - key: SEED_DEMO
        value: "false"
databases:
  - name: job-intelligence-db
    databaseName: jobs
    user: jobs
    plan: basic-256mb
    region: oregon
