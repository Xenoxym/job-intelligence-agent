name: Optional deployed ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1-5'
permissions:
  contents: read
concurrency:
  group: deployed-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: python scripts/ingest_remote.py
        env:
          JOB_INTELLIGENCE_URL: ${{ vars.JOB_INTELLIGENCE_URL }}
          API_TOKEN: ${{ secrets.JOB_INTELLIGENCE_API_TOKEN }}
