name: V1 validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check backend migrations scripts tests
      - run: ruff format --check backend migrations scripts tests
      - run: pytest -q
      - run: alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - run: python scripts/browser_smoke.py
      - run: docker compose restart && docker compose up -d --wait --wait-timeout 120
      - run: python scripts/smoke.py --verify-only
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: artifacts/
      - if: always()
        run: docker compose down
